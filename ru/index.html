<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Русская версия</title>
    <script>
        function getAvailableVersions() {
            return ['v1.0', 'v1.1', 'v1.2'];
        }
        
        function renderNavigation() {
            const versions = getAvailableVersions();
            const container = document.getElementById('versions-list');
            
            versions.forEach(version => {
                const li = document.createElement('li');
                li.innerHTML = `<a href="../${version}/ru/index.html">${version}</a>`;
                container.appendChild(li);
            });
        }
        
        document.addEventListener('DOMContentLoaded', renderNavigation);
    </script>
</head>
<body>
    <h1>Русская версия сайта</h1>
    <p>Это актуальная версия на русском языке</p>
    
    <h2>Доступные версии:</h2>
    <nav>
        <ul id="versions-list">
            <!-- Версии добавляются автоматически -->
        </ul>
    </nav>
    
    <h2>Навигация:</h2>
    <nav>
        <ul>
            <li><a href="../index.html">Главная страница</a></li>
            <li><a href="../en/index.html">Английская версия</a></li>
        </ul>
    </nav>
</body>
</html>
