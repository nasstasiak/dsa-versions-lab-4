<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Русская версия</title>
    <script>
        function renderNavigation() {
            const versionsContainer = document.getElementById('versions-list');
            
            // Автоматически определяем текущий путь
            const basePath = window.location.pathname.split('/').slice(0, -2).join('/');
            
            // Все версии, которые будут созданы
            const versions = [];
            for (let i = 0; i <= 10; i++) {
                versions.push(`v1.${i}`);
            }
            
            // Рендерим версии
            versions.forEach(version => {
                const li = document.createElement('li');
                const link = `${basePath}/${version}/ru/index.html`;
                li.innerHTML = `<a href="${link}">${version}</a>`;
                versionsContainer.appendChild(li);
            });
        }
        
        document.addEventListener('DOMContentLoaded', renderNavigation);
    </script>
</head>
<body>
    <h1>Русская версия сайта</h1>
    <p>Это актуальная версия на русском языке</p>
    
    <h2>Доступные версии:</h2>
    <nav>
        <ul id="versions-list">
            <!-- Версии добавляются автоматически -->
        </ul>
    </nav>
    
    <h2>Навигация:</h2>
    <nav>
        <ul>
            <li><a href="../index.html">Главная страница</a></li>
            <li><a href="../en/index.html">Английская версия</a></li>
        </ul>
    </nav>
</body>
</html>
