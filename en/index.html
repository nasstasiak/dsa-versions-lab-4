<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>English Version</title>
    <script>
        function renderNavigation() {
            const versionsContainer = document.getElementById('versions-list');
            
            // Автоматически определяем текущий путь
            const basePath = window.location.pathname.split('/').slice(0, -2).join('/');
            
            // Все версии, которые будут созданы
            const versions = [];
            for (let i = 0; i <= 10; i++) {
                versions.push(`v1.${i}`);
            }
            
            // Рендерим версии
            versions.forEach(version => {
                const li = document.createElement('li');
                const link = `${basePath}/${version}/en/index.html`;
                li.innerHTML = `<a href="${link}">${version}</a>`;
                versionsContainer.appendChild(li);
            });
        }
        
        document.addEventListener('DOMContentLoaded', renderNavigation);
    </script>
</head>
<body>
    <h1>English Version</h1>
    <p>This is the current version in English</p>
    
    <h2>Available versions:</h2>
    <nav>
        <ul id="versions-list">
            <!-- Versions added automatically -->
        </ul>
    </nav>
    
    <h2>Navigation:</h2>
    <nav>
        <ul>
            <li><a href="../index.html">Main page</a></li>
            <li><a href="../ru/index.html">Russian version</a></li>
        </ul>
    </nav>
</body>
</html>
