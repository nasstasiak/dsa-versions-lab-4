<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главная страница</title>
</head>
<body>
    <h1>Главная страница</h1>
    
    <h2>Доступные версии:</h2>
    <nav>
        <ul id="versions-list">
            <!-- Версии появятся здесь автоматически после создания релизов -->
        </ul>
        <p><em>Создайте релиз на GitHub чтобы добавить новую версию</em></p>
    </nav>
    
    <h2>Языки (текущая версия):</h2>
    <nav>
        <ul>
            <li><a href="ru/index.html">Русская версия</a></li>
            <li><a href="en/index.html">English version</a></li>
        </ul>
    </nav>

    <script>
        // Простая навигация - версии будут добавляться вручную
        // или через более сложный скрипт с GitHub API
        const versionsContainer = document.getElementById('versions-list');
        
        // Пока пусто - версии появятся после создания релизов
        // Можно добавить первую версию вручную:
        const li = document.createElement('li');
        li.innerHTML = '<a href="v1.0/">v1.0</a>';
        versionsContainer.appendChild(li);
    </script>
</body>
</html>
