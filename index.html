<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главная страница</title>
    <script>
        function renderNavigation() {
            const versionsContainer = document.getElementById('versions-list');
            const languagesContainer = document.getElementById('languages-list');
            
            // Автоматически определяем текущий базовый URL
            const basePath = window.location.pathname.split('/').slice(0, -1).join('/');
            const isVersioned = basePath.includes('/v');
            
            // Список версий - будет автоматически работать для всех созданных версий
            const versions = [];
            for (let i = 1; i <= 10; i++) {
                versions.push(`v1.${i}`);
            }
            
            // Рендерим версии
            versions.forEach(version => {
                const li = document.createElement('li');
                li.innerHTML = `<a href="${version}/">${version}</a>`;
                versionsContainer.appendChild(li);
            });
            
            // Рендерим языки
            const languages = [
                { code: 'ru', name: 'Русская версия' },
                { code: 'en', name: 'English version' }
            ];
            
            languages.forEach(lang => {
                const li = document.createElement('li');
                const link = isVersioned ? `../${lang.code}/index.html` : `${lang.code}/index.html`;
                li.innerHTML = `<a href="${link}">${lang.name}</a>`;
                languagesContainer.appendChild(li);
            });
        }
        
        document.addEventListener('DOMContentLoaded', renderNavigation);
    </script>
</head>
<body>
    <h1>Главная страница</h1>
    
    <h2>Доступные версии:</h2>
    <nav>
        <ul id="versions-list">
            <!-- Версии добавляются автоматически -->
        </ul>
    </nav>
    
    <h2>Языки:</h2>
    <nav>
        <ul id="languages-list">
            <!-- Языки добавляются автоматически -->
        </ul>
    </nav>
</body>
</html>
