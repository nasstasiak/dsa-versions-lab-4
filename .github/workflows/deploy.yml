name: Deploy to GitHub Pages

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create version directory
        run: |
          # Получаем название тега (например v1.0)
          VERSION_TAG=${GITHUB_REF#refs/tags/}
          echo "Creating version: $VERSION_TAG"
          
          # Создаем папку для версии
          mkdir -p $VERSION_TAG
          
          # Копируем ВСЕ файлы в папку версии
          cp -r *.html $VERSION_TAG/ 2>/dev/null || true
          cp -r ru $VERSION_TAG/ 2>/dev/null || true
          cp -r en $VERSION_TAG/ 2>/dev/null || true
          
          # Показываем структуру для отладки
          find . -type f -name "*.html" | sort

      - name: Setup Pages
        uses: actions/configure-pages@v2

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v1