name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create basic site structure
        run: |
          # Создаем базовые HTML файлы если их нет
          if [ ! -f index.html ]; then
            cat > index.html << EOF
<!DOCTYPE html>
<html>
<head>
    <title>Main Page</title>
</head>
<body>
    <h1>Welcome to GitHub Pages</h1>
    <p>This is the main page.</p>
    <ul>
        <li><a href="ru/index.html">Russian Version</a></li>
        <li><a href="en/index.html">English Version</a></li>
    </ul>
</body>
</html>
EOF
          fi

          if [ ! -f ru/index.html ]; then
            mkdir -p ru
            cat > ru/index.html << EOF
<!DOCTYPE html>
<html>
<head>
    <title>Russian Version</title>
</head>
<body>
    <h1>Русская версия</h1>
    <p>Это русская версия сайта.</p>
    <a href="../index.html">На главную</a>
</body>
</html>
EOF
          fi

          if [ ! -f en/index.html ]; then
            mkdir -p en
            cat > en/index.html << EOF
<!DOCTYPE html>
<html>
<head>
    <title>English Version</title>
</head>
<body>
    <h1>English Version</h1>
    <p>This is the English version.</p>
    <a href="../index.html">Main page</a>
</body>
</html>
EOF
          fi

      - name: Generate versioned sites
        run: |
          # Создаем папки для всех версий (тегов)
          git fetch --tags
          for tag in $(git tag -l "v*" | sort -V); do
            echo "Creating version: $tag"
            mkdir -p "$tag"
            # Копируем базовые файлы в версионную папку
            cp index.html "$tag/" || true
            cp -r ru "$tag/" || true
            cp -r en "$tag/" || true
          done
          
          echo "=== Final structure ==="
          find . -name "*.html" | sort
          echo "=== Files in root ==="
          ls -la

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4