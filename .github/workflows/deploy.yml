name: Deploy and Update HTML

on:
  push:
    branches: [ gh-pages ]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Get all version tags
        id: get_versions
        run: |
          # Получаем все теги, начинающиеся с v и сортируем по версии
          git fetch --tags
          VERSIONS=$(git tag -l "v*" | sort -V)
          echo "VERSIONS:"
          echo "$VERSIONS"
          
          # Сохраняем версии в формате для следующих шагов
          echo "versions_list=$VERSIONS" >> $GITHUB_OUTPUT
          
          # Создаем HTML список версий
          HTML_LIST=""
          for version in $VERSIONS; do
            HTML_LIST="$HTML_LIST<li><a href=\"$version/index.html\">$version</a></li>"
          done
          echo "html_list=$HTML_LIST" >> $GITHUB_OUTPUT
          
          # Для русской и английской версий
          HTML_LIST_RU=""
          HTML_LIST_EN=""
          for version in $VERSIONS; do
            HTML_LIST_RU="$HTML_LIST_RU<li><a href=\"../$version/ru/index.html\">$version</a></li>"
            HTML_LIST_EN="$HTML_LIST_EN<li><a href=\"../$version/en/index.html\">$version</a></li>"
          done
          echo "html_list_ru=$HTML_LIST_RU" >> $GITHUB_OUTPUT
          echo "html_list_en=$HTML_LIST_EN" >> $GITHUB_OUTPUT

      - name: Update HTML files with versions
        run: |
          # Обновляем главную страницу
          sed "s|{{VERSIONS_LIST}}|${{ steps.get_versions.outputs.html_list }}|g" templates/main_template.html > index.html
          
          # Обновляем русскую версию
          mkdir -p ru
          sed "s|{{VERSIONS_LIST}}|${{ steps.get_versions.outputs.html_list_ru }}|g" templates/ru_template.html > ru/index.html
          
          # Обновляем английскую версию
          mkdir -p en
          sed "s|{{VERSIONS_LIST}}|${{ steps.get_versions.outputs.html_list_en }}|g" templates/en_template.html > en/index.html
          
          # Показываем что получилось
          echo "=== Главная страница ==="
          head -20 index.html
          echo "=== Русская версия ==="
          head -20 ru/index.html
          echo "=== Английская версия ==="
          head -20 en/index.html

      - name: Create version directories
        run: |
          # Создаем папки для ВСЕХ версий
          git fetch --tags
          for version in $(git tag -l "v*" | sort -V); do
            echo "Создаем директорию для версии: $version"
            mkdir -p "$version"
            
            # Копируем текущие файлы в версионную папку
            cp index.html "$version/" || true
            cp -r ru "$version/" || true
            cp -r en "$version/" || true
          done
          
          # Показываем структуру
          echo "=== Структура проекта ==="
          find . -name "*.html" | head -20

      - name: Commit and push changes
        run: |
          # Добавляем все изменения
          git add .
          
          # Проверяем есть ли изменения для коммита
          if git diff --staged --quiet; then
            echo "Нет изменений для коммита"
          else
            git commit -m "Auto-update: Обновлены версии [skip ci]"
            git push origin gh-pages
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show deployment URL
        run: |
          echo "Сайт доступен по адресу: ${{ steps.deployment.outputs.page_url }}"
          echo "Версии доступны по:"
          git fetch --tags
          for version in $(git tag -l "v*" | sort -V); do
            echo "- ${{ steps.deployment.outputs.page_url }}$version/"
          done