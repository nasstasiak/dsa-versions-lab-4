name: Deploy to GitHub Pages

on:
  push:
    branches: [ gh-pages ]
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create basic HTML files
        run: |
          # СОЗДАЕМ БАЗОВЫЕ ФАЙЛЫ ЕСЛИ ИХ НЕТ
          if [ ! -f index.html ]; then
            echo "<html><body><h1>Main Page</h1><a href='ru/index.html'>Russian</a> <a href='en/index.html'>English</a></body></html>" > index.html
          fi
          
          mkdir -p ru
          if [ ! -f ru/index.html ]; then
            echo "<html><body><h1>Russian Page</h1><a href='../index.html'>Main</a></body></html>" > ru/index.html
          fi
          
          mkdir -p en
          if [ ! -f en/index.html ]; then
            echo "<html><body><h1>English Page</h1><a href='../index.html'>Main</a></body></html>" > en/index.html
          fi

      - name: Generate versioned sites
        run: |
          # Создаем папки для всех версий (тегов)
          git fetch --tags
          for tag in $(git tag -l "v*" | sort -V); do
            echo "Creating version: $tag"
            mkdir -p "$tag"
            # Копируем базовые файлы
            cp -r *.html ru en "$tag/" 2>/dev/null || true
          done
          
          echo "Final structure:"
          find . -name "*.html" | sort

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4